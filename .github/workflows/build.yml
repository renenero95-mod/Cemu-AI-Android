name: Build Cemu Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    
    steps:
    - name: Checkout User Repo
      uses: actions/checkout@v4

    - name: Clone Cemu Android Repo
      run: |
        git clone --recursive -b android-port https://github.com/SapphireRhodonite/Cemu.git Cemu

    - name: Modify Application ID
      run: |
        sed -i 's/applicationId = ".*"/applicationId = "com.cemu.aimod"/g' Cemu/src/android/app/build.gradle.kts

    - name: Install system dependencies
      run: |
        sudo apt update -qq
        sudo apt install -y gettext mono-complete

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant execute permission for gradlew
      run: chmod +x Cemu/src/android/gradlew

    - name: Build APK with Gradle
      run: |
        cd Cemu/src/android
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Cemu-AI-Mod-APK
        path: Cemu/src/android/app/build/outputs/apk/debug/*.apk
