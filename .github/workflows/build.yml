permissions:
  contents: write

name: Build Cemu Android APK with AI Patch

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    
    steps:
    - name: Checkout User Repo (to get patch.diff)
      uses: actions/checkout@v4

    - name: Clone Official SSimco Cemu Repo
      run: |
        git clone --recursive -b android-port https://github.com/renenero95-mod/Cemu.git Cemu

    - name: Apply AI Patch (SKIPPED - fork already contains all fixes)
      run: |
        echo "⏭️ Step skipped: build from renenero95-mod/Cemu fork (already patched)"

    - name: Modify Application ID
      run: |
        BUILD_FILE=$(find Cemu -name "build.gradle.kts" -path "*/app/*" | head -n 1)
        if [ -n "$BUILD_FILE" ]; then
          sed -i 's/applicationId = ".*"/applicationId = "com.cemu.aimod"/g' "$BUILD_FILE"
        else
          echo "Attenzione: build.gradle.kts non trovato!"
        fi

    - name: Install system dependencies
      run: |
        sudo apt update -qq
        sudo apt install -y gettext mono-complete

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools'

    - name: Build APK with Gradle
      run: |
        GRADLEW_FILE=$(find Cemu -name "gradlew" | head -n 1)
        cd $(dirname "$GRADLEW_FILE")
        chmod +x gradlew
        ./gradlew assembleRelease -Pandroid.injected.build.api=34 -DCMAKE_BUILD_TYPE=Release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Cemu-AI-Mod-APK
        path: Cemu/**/*.apk

    - name: Create GitHub Release
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: "Cemu AI Mod (Latest Build)"
        body: |
          Build automatica dal commit ${{ github.sha }}.
          Basata su Cemu (MPL 2.0) e SSimco/Cemu.
        files: Cemu/**/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
