name: Build Cemu Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    
    steps:
    - name: Checkout User Repo
      uses: actions/checkout@v4

    - name: Clone Cemu Android Repo
      run: |
        git clone --recursive -b android-port https://github.com/SapphireRhodonite/Cemu.git Cemu

    - name: Find and Modify Application ID
      run: |
        BUILD_FILE=$(find Cemu -name "build.gradle.kts" -path "*/app/*" | head -n 1)
        if [ -z "$BUILD_FILE" ]; then
          echo "ERRORE: File di build non trovato!"
          exit 1
        fi
        sed -i 's/applicationId = ".*"/applicationId = "com.cemu.aimod"/g' "$BUILD_FILE"

    - name: Install system dependencies
      run: |
        sudo apt update -qq
        sudo apt install -y gettext mono-complete

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools'

    - name: Build APK with Gradle
      run: |
        GRADLEW_FILE=$(find Cemu -name "gradlew" | head -n 1)
        cd $(dirname "$GRADLEW_FILE")
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Cemu-AI-Mod-APK
        path: Cemu/**/build/outputs/apk/debug/*.apk
