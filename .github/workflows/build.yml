name: Build Cemu Android
on:
  workflow_dispatch:
    inputs:
      cemu_ref:
        description: 'Branch, tag o SHA di Cemu (default: android-port)'
        required: true
        default: 'android-port'
        type: string
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android Build Repo
        uses: actions/checkout@v4

      - name: Checkout Cemu Repo
        env:
          CEMU_REF: ${{ github.event.inputs.cemu_ref || 'android-port' }}
        run: |
          git clone --recursive -b android-port https://github.com/renenero95-mod/Cemu.git Cemu
          cd Cemu
          git checkout "$CEMU_REF"
          git submodule update --init --recursive
          echo "CEMU_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          cmdline-tools-version: 'latest'

      - name: Install NDK
        run: |
          echo "y" | sdkmanager --install "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Build with Gradle
        run: |
          cd Cemu
          
          # Trova e modifica l'applicationId (cerca in tutto il repo)
          GRADLE_FILE=$(grep -rl 'info.cemu.cemu' --include="build.gradle*" . | head -n 1)
          if [ -n "$GRADLE_FILE" ]; then
            echo "Modifying applicationId in $GRADLE_FILE"
            sed -i 's/info.cemu.cemu/com.cemu.aimod.debug/g' "$GRADLE_FILE"
          else
            echo "WARNING: applicationId not found. Skipping sed."
          fi
          
          # Trova la posizione di gradlew e compila
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "ERROR: gradlew not found!"
            exit 1
          fi
          
          echo "Found gradlew at $GRADLEW_PATH"
          cd "$(dirname "$GRADLEW_PATH")"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cemu-Android-PPC-Analyzer-${{ env.CEMU_SHA }}
          path: Cemu/**/build/outputs/apk/debug/*.apk
